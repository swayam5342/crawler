crawl:
  seed_urls: []
  allowed_domains: []
  max_depth: 5
  user_agent: "web_crawler/1.0 (+https://example.com/bot)"
  max_body_bytes: 10485760
  max_redirects: 10
  honor_nofollow: true
  honor_noindex: true

concurrency:
  global: 50
  per_domain: 2

rate_limit:
  requests_per_second: 1
  burst: 1

timeouts:
  dns: 5s
  connect: 5s
  tls: 5s
  request: 30s
  overall: 1h

retry:
  max_attempts: 4
  base_backoff: 500ms
  max_backoff: 30s
  jitter_factor: 0.3

circuit_breaker:
  failure_threshold: 5
  cooldown_period: 1m
  half_open_max_calls: 1

robots:
  cache_ttl: 1h
  timeout: 10s

storage:
  postgres:
    dsn: "postgres://crawler:crawler@localhost:5432/crawler?sslmode=disable"
    max_open_conns: 10
    max_idle_conns: 5
    conn_max_lifetime: 30m
  blob_store:
    backend: local
    local:
      dir: "./data/blobs"
    s3:
      bucket: ""
      region: ""
      prefix: ""
      endpoint: ""

server:
  addr: ":9090"
  grace_period: 30s

logging:
  level: info
  format: text
