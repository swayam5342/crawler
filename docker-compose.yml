services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: crawler
      POSTGRES_PASSWORD: crawler
      POSTGRES_DB: crawler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crawler"]
      interval: 5s
      timeout: 5s
      retries: 5

  crawler:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CRAWLER_POSTGRES_DSN: "postgres://crawler:crawler@postgres:5432/crawler?sslmode=disable"
    ports:
      - "9090:9090"
    volumes:
      - crawler_data:/app/data
    stop_grace_period: 60s

volumes:
  postgres_data:
  crawler_data:
